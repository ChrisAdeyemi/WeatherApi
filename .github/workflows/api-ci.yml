name: Weather API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore WeatherAPI/WeatherAPI.csproj

      - name: Restore tests
        run: dotnet restore WeatherAPI.Tests/WeatherAPI.Tests.csproj

      - name: Build API
        run: dotnet build WeatherAPI/WeatherAPI.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build WeatherAPI.Tests/WeatherAPI.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WeatherAPI.Tests/WeatherAPI.Tests.csproj --configuration Release --no-build
