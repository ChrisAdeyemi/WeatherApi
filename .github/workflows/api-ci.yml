name: Weather API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore API
        run: dotnet restore WeatherAPI/WeatherAPI.csproj

      - name: Restore tests
        run: dotnet restore WeatherAPI.Tests/WeatherAPI.Tests.csproj

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"ChrisAdeyemi_WeatherApi"
          /o:"chrisadeyemi"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          /d:sonar.host.url="https://sonarcloud.io"

      - name: Build API
        run: dotnet build WeatherAPI/WeatherAPI.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build WeatherAPI.Tests/WeatherAPI.Tests.csproj --configuration Release --no-restore

      - name: Run tests and generate coverage
        run: >
          dotnet-coverage collect
          "dotnet test WeatherAPI.Tests/WeatherAPI.Tests.csproj
          --configuration Release
          --no-build"
          -f xml
          -o coverage.xml

      - name: Check coverage report
        run: |
          echo "Checking coverage report..."
          ls -lh coverage.xml
          head -c 1000 coverage.xml

      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="$SONAR_TOKEN"
